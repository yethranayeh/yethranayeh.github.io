<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omp poster sun — background only</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="flip">
        <canvas id="poster" aria-hidden="true"></canvas>
      </div>
      <span class="scanlines"></span>
    </div>
    <div class="controls">
      <button id="mode-toggle" class="pill" type="button" data-active="false">
        <span class="glyph" aria-hidden="true"></span>
        <span>motion</span>
      </button>
      <label class="speed">
        <span class="speed-label">speed</span>
        <input id="speed" type="range" min="0" max="2" step="0.01" value="1" />
        <output id="speed-value" for="speed">1.00x</output>
      </label>
      </div>
    <div class="transport">
      <button id="play-toggle" class="pill" type="button" data-active="false" aria-label="Play mood track">
        <span class="glyph" aria-hidden="true"></span>
        <span>sound</span>
      </button>
      <input
        id="seek"
        class="seek"
        type="range"
        min="0"
        max="100"
        step="0.1"
        value="0"
        disabled
        aria-label="Seek mood track"
      />
      <span id="time" class="time">0:00 / 0:00</span>
    </div>
    <div id="player-host" class="player-host"></div>
    <span id="hint" aria-live="polite"></span>
    <script type="module" src="script.js"></script>
  </body>
</html>
